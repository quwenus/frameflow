name: Windows release package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release version
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Release tag must match package.json version.' }
      - run: npm run check
      - run: npm test
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Frameflow-windows
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
      - name: Attach files to GitHub release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $files = @(Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|sha256)$' } | ForEach-Object { $_.FullName })
          gh release upload $env:RELEASE_TAG @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
